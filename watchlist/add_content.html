<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add Content</title>
        <link href="/style.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class="navbar">
            <nav>
                <a href="/home">Home</a>
                <a href="/series">Anime</a>
                <a href="/movies">Movies</a>
                <a href="/create_account">Create Account</a>
            </nav>
        </div>
        <div class="search-for-content">
            <div class="search-bar">
                <input type="text" id="content-name" placeholder="Enter content name">
                <button id="search-content-button" onclick="">Search Content</button>
            </div>
            <div class="search-results">
                <ul id="content-list">
                    <!-- Content items will be dynamically inserted here -->
                </ul>
            </div>
        </div>
        <script>
            document.getElementById('content-name').addEventListener('keypress', function(e) {
                if (e.key == "Enter") {
                    seachContent();
                }
            });
            document.getElementById('search-content-button').addEventListener('click', function() {
                seachContent();
            });

            function seachContent() {
                const contentName = document.getElementById('content-name').value;
                if (contentName) {
                    fetch(`/api/search?query=${encodeURIComponent(contentName)}`)
                        .then(async response => {
                            const responseText = await response.text();
                            if (!responseText.trim()) {
                                throw new Error('The search service returned an empty response.');
                            }

                            let data;
                            try {
                                data = JSON.parse(responseText);
                            } catch (error) {
                                throw new Error(`The search service returned an invalid response (${response.status}).`);
                            }

                            if (!response.ok) {
                                const message = data && typeof data === 'object' && typeof data.error === 'string'
                                    ? data.error
                                    : `Search failed (${response.status}).`;
                                throw new Error(message);
                            }
                            if (!Array.isArray(data)) {
                                throw new Error('The search service returned an invalid response.');
                            }
                            return data;
                        })
                        .then(data => {
                            const contentList = document.getElementById('content-list');
                            contentList.innerHTML = '';
                            data.forEach(content => {
                                const contentDetail = document.createElement('div');
                                const poster = `https://image.tmdb.org/t/p/w500/${content.poster_path}`
                                let name = "";
                                if (content.media_type === "movie") {
                                    name = content.title;
                                } else {
                                    name = content.name;
                                }
                                contentDetail.innerHTML = `
                                    <li class="content-element">    
                                        <img src="${poster}" alt="${name} image">
                                        <div class="content-info">
                                            <h4>${name}</h4>
                                            <p>${content.overview}</p>
                                        </div>
                                        <div class= "right-side">
                                            <button class="add-button">+</button>
                                        </div>
                                        <div class="hidden">
                                            <p>${content.media_type}</p>
                                        </div>
                                    </li>
                                `;
                                contentList.appendChild(contentDetail);
                            });
                        })
                        .catch(error => {
                            console.error('Error searching content:', error);
                            const contentList = document.getElementById('content-list');
                            contentList.innerHTML = '';
                            const errorMessage = document.createElement('li');
                            errorMessage.className = 'content-error';
                            errorMessage.setAttribute('role', 'alert');
                            errorMessage.textContent = error.message;
                            contentList.appendChild(errorMessage);
                        });
                }
            }

            document.getElementById('content-list').addEventListener('click', function(event) {
                if (event.target.classList.contains('add-button')) {
                    const contentElement = event.target.parentElement.parentElement;
                    const contentInfo = contentElement.querySelector('.content-info');
                    const contentName = contentInfo.querySelector('h4').innerText;
                    const contentDescription = contentInfo.querySelector('p').innerText;
                    const contentPoster = contentElement.querySelector('img').src;
                    const contentType = contentElement.querySelector('.hidden').querySelector('p').innerText;
                    fetch('/api/add_content', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: contentName,
                            description: contentDescription,
                            poster: contentPoster,
                            media_type: contentType
                        })
                    })
                        .then(response => response.json())
                        .then(data => {
                            console.log('Content added:', data);
                        })
                        .catch(error => console.error('Error adding content:', error));
                }
            });
        </script>
    </body>
</html>
