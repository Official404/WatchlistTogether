<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Series</title>
        <link href="/style.css" rel="stylesheet" type="text/css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <div class="navbar">
            <nav>
                <a href="/home">Home</a>
                <a href="/series">Anime</a>
                <a href="/movies">Movies</a>
                <a href="/create_account">Create Account</a>
            </nav>
        </div>
        <div class="watchlist-content">
            <div class="watchlist-header">
                <h2>Series Watchlist</h2>
                <h3 id="series-filter-label"> Filter: </h3>
                <select id="series-filter">
                    <option value="" style="background-color:#fdfdfd">All</option>
                    <option value="0" style="background-color:#ffb3ba">Not Started</option>
                    <option value="1" style="background-color:#fff59a">Watching</option>
                    <option value="2" style="background-color:#a2ff9a">Done</option>
                    <option value="3" style="background-color:#554746; color: #ffffff">Dropped</option>
                </select>
                <a href="/add_content">+</a>
            </div>
            
            <div class="watchlist">
                <ul id="series-list">
                    <!-- Series items will be dynamically inserted here -->
                </ul>
            </div>
        </div>
        <script src="./scripts/series.js"></script>
    </body>
</html>
